<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrito de compras - GAD Boutique</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f9f9f9;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      color: #12372A;
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: white;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ccc;
    }
    th {
      background-color: #12372A;
      color: white;
    }
    .total {
      text-align: right;
      margin-top: 20px;
      font-size: 1.2em;
    }
    .volver {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 20px;
      background-color: #12372A;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
    .vaciar {
      float: right;
      background-color: #a00;
      color: white;
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .eliminar {
      background-color: #a00;
      color: white;
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Carrito de Compras</h1>
  <button class="vaciar" onclick="vaciarCarrito()">Vaciar carrito</button>
  <table id="tabla-carrito">
    <thead>
      <tr>
        <th>Producto</th>
        <th>Precio</th>
        <th>Cantidad</th>
        <th>Subtotal</th>
        <th>Eliminar</th>
      </tr>
    </thead>
    <tbody>
      <!-- Aquí se insertan los productos -->
    </tbody>
  </table>
  <div class="total" id="total">Total: $0.00</div>

  <a class="volver" href="index.html">← Volver al catálogo</a>

  <script>
    function cargarCarrito() {
      let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
      let tabla = document.querySelector('#tabla-carrito tbody');
      let total = 0;
      tabla.innerHTML = '';

      carrito.forEach((item, index) => {
        let subtotal = item.precio * item.cantidad;
        total += subtotal;

        tabla.innerHTML += `
          <tr>
            <td>${item.nombre}</td>
            <td>$${item.precio.toFixed(2)}</td>
            <td>${item.cantidad}</td>
            <td>$${subtotal.toFixed(2)}</td>
            <td><button class="eliminar" onclick="eliminarProducto(${index})">Eliminar</button></td>
          </tr>`;
      });

      document.getElementById('total').innerText = `Total: $${total.toFixed(2)}`;
    }

    function eliminarProducto(index) {
      let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
      carrito.splice(index, 1); // Elimina el producto en el índice indicado
      localStorage.setItem('carrito', JSON.stringify(carrito)); // Guarda el carrito actualizado
      cargarCarrito(); // Recarga el carrito actualizado
    }

    function vaciarCarrito() {
      localStorage.removeItem('carrito');
      cargarCarrito();
    }

    cargarCarrito();
  </script>
</body>
</html>
